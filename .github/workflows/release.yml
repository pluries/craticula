# Release of the ten Craticula NuGet packages (TRD OS-2 / OS-8).
# Two ways in: the release-please workflow calls this one after a release pull request is merged (Release Please has
# then already created the GitHub release and the tag `dotnet-vX.Y.Z`), or the maker starts it by hand with the manual
# dispatch. Either way it runs only from `main`, the `version` input must equal <Version> in
# csharp/src/Directory.Build.props, and that version must not exist on nuget.org yet.
# No NuGet key is stored anywhere: the publish job exchanges its GitHub OIDC token for a short-lived key (nuget.org
# Trusted Publishing). The publish job runs in the protected environment `nuget` (the maker is its required reviewer;
# the environment must also be limited to the `main` branch, because a branch can edit this file).
# Open point, unverified: when this file is called, the OIDC token's workflow claim names the calling file
# (release-please.yml), so the nuget.org Trusted Publishing policy may have to name release-please.yml, not release.yml.
# The last two jobs, release-notes and sbom, are non-blocking: one adds the spec version line to the release notes, the other
# attaches a CycloneDX SBOM per package.
# Known deviations, in plain words: this workflow holds its own steps instead of calling shared organisation workflows
# (the public repository has none); it is called by the release-please workflow instead of starting on a tag (a tag made
# with the default token starts no workflow); the release tag is `dotnet-v<version>`; the repository belongs to a user,
# not an organisation.
name: release

on:
  workflow_call:
    inputs:
      version:
        description: 'Version to release; must equal <Version> in csharp/src/Directory.Build.props (for example 1.0.0)'
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release; must equal <Version> in csharp/src/Directory.Build.props (for example 1.0.0)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pack:
    runs-on: ubuntu-latest
    # Smoke about 3 min, offline tests, then the container tier with its 10-minute parity budget and image pulls
    # (the nightly allows 60 minutes for the tier alone).
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      # Fail loudly, first, from any ref but main. In a called workflow GITHUB_REF is the caller's ref, so it is
      # refs/heads/main for the release-please run (triggered by a push to main) and the dispatched ref for a manual run.
      # A guard in this file is not enough alone (a branch can edit its own
      # copy): the real control is the environment `nuget` limited to `main` (Deployment branches and tags).
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::The release runs only from refs/heads/main; this run is on '$GITHUB_REF'. Run it from main."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Check that the input equals the Version property
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          props="$(grep -oP '(?<=<Version>)[^<]+' csharp/src/Directory.Build.props | head -n 1)"
          if [ "$INPUT_VERSION" != "$props" ]; then
            echo "::error::Requested version '$INPUT_VERSION' does not equal <Version> '$props' in csharp/src/Directory.Build.props. Bump the property on main first, or release '$props'."
            exit 1
          fi
          echo "Releasing $props"

      # Ten ids from the pack smoke's own list. A published version is permanent: bump <Version> instead of re-running.
      - name: Check that the version is not on nuget.org yet
        run: python scripts/pack_check_unpublished.py

      - name: Pack smoke
        run: bash scripts/pack-smoke.sh

      - name: Offline tests
        working-directory: csharp
        run: >
          dotnet test Craticula.sln
          --filter "FullyQualifiedName!~MongoDB.Driver.Tests&FullyQualifiedName!~OpenSearch.Client.Tests&FullyQualifiedName!~Integration.Tests.Containers"

      # Execution-equality tier and parity property tests on all engines in containers (TRD P-3, "on release"): the
      # same run as the nightly pipeline. "on" makes a missing Docker daemon fail instead of skipping. Oracle Free 23ai is
      # one of the engines since #2880 (OQ-6), so a failing Oracle test stops the release and the runner pulls the Oracle
      # image (about 6.5 GB unpacked) next to the SQL Server and search ones.
      - name: Integration tier (containers and parity)
        run: dotnet test csharp/tests/Craticula.Integration.Tests -c Release
        env:
          CRATICULA_INTEGRATION_DOCKER: "on"
          CRATICULA_PARITY_SEED: "20261010"
          CRATICULA_PARITY_CASES: "200"

      - name: Pack the ten packages
        run: |
          mkdir -p "$RUNNER_TEMP/nupkgs"
          for proj in csharp/src/*/*.csproj; do
            dotnet pack "$proj" -c Release -o "$RUNNER_TEMP/nupkgs"
          done
          ls -l "$RUNNER_TEMP/nupkgs"
          test "$(ls "$RUNNER_TEMP"/nupkgs/*.nupkg | wc -l)" -eq 10

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nupkgs
          path: ${{ runner.temp }}/nupkgs/*.nupkg
          if-no-files-found: error

  publish:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write       # OIDC: NuGet/login and the attestation
      attestations: write   # actions/attest-build-provenance
      contents: write       # the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nupkgs
          path: nupkgs

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: the user is the nuget.org profile name (a repository variable, not a secret).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      # --skip-duplicate only matters after a partial publish (some ids went through, one failed): the pack job already
      # refuses a version that is on nuget.org, so a normal run never meets a duplicate. Finishing a partial publish is a
      # deliberate manual path (see the maker's release checklist); the default is to bump <Version>.
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          for f in nupkgs/*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: nupkgs/*.nupkg

      # Tag name: `dotnet-v<version>` (TRD OS-2). In a called workflow github.event_name is the caller's event ('push'),
      # so only a manual dispatch creates the release; after a release pull request Release Please already created the
      # release and the tag, and the packages are attached to it (an existing asset of the same name fails the upload, nothing is overwritten).
      # The CycloneDX SBOMs (TRD OS-5) are attached by the sbom job below, after this one.
      - name: GitHub release (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >
          gh release create "dotnet-v$VERSION" nupkgs/*.nupkg
          --repo "$GITHUB_REPOSITORY"
          --target "$GITHUB_SHA"
          --title "dotnet-v$VERSION"
          --generate-notes

      - name: Attach packages to the Release Please release
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >
          gh release upload "dotnet-v$VERSION" nupkgs/*.nupkg
          --repo "$GITHUB_REPOSITORY"

  # The spec version and the size of the fixture suite go into the release notes. This is its own job, after the packages
  # are on nuget.org and attached to the release, for two reasons: the publish job holds the OIDC token and the
  # attestation right, so it runs no repository script and has no checkout; and a failure here must never fail a release
  # that already published (job-level continue-on-error, a warning annotation instead). A missing line is fixed by hand
  # with `gh release edit`. The job has `contents: write` only (what `gh release edit` needs), no environment, no
  # id-token. The checkout takes only `spec` and the one script, with no stored token.
  release-notes:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            spec
            scripts/release_notes.py
          sparse-checkout-cone-mode: false

      - name: Add the spec version to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if gh release view "dotnet-v$VERSION" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$notes" \
            && python3 scripts/release_notes.py --spec-version-file spec/VERSION --fixtures spec/fixtures --append-to "$notes" \
            && gh release edit "dotnet-v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$notes"; then
            echo "Release notes of dotnet-v$VERSION carry the spec version line"
          else
            echo "::warning::Could not add the spec version line to the notes of dotnet-v$VERSION; the release itself is published. Add it by hand: gh release edit."
            exit 1
          fi

  # One CycloneDX SBOM per packed project, attached to the release (spec FR-05, NFR-04). Same shape as release-notes: after
  # publish, a failure only raises a warning because the packages are already on nuget.org, `contents: write` only, no
  # environment, no id-token, no stored token; the token reaches only the upload step, never the third-party tool. The demo under examples/demo is not packed and gets no SBOM. A file that is
  # already attached makes the upload fail instead of being overwritten; the maker adds a missing SBOM by hand with `gh release upload`.
  sbom:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install the CycloneDX tool
        run: dotnet tool install CycloneDX --version 6.3.1 --tool-path "$RUNNER_TEMP/tools"

      - name: Generate one SBOM per packed project
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir sbom
          for proj in csharp/src/*/*.csproj; do
            name="$(basename "$proj" .csproj)"
            "$RUNNER_TEMP/tools/dotnet-CycloneDX" "$proj" -o sbom -fn "$name.cdx.json" -F Json -sn "$name" -sv "$VERSION" -c Release -st Library -ipr \
              || { echo "::warning::CycloneDX failed for $name; no SBOM is attached to dotnet-v$VERSION. Add them by hand."; exit 1; }
          done
          count="$(ls sbom/*.cdx.json | wc -l)"
          [ "$count" -eq 10 ] || { echo "::warning::Expected 10 SBOMs, made $count; none is attached to dotnet-v$VERSION. Add them by hand."; exit 1; }

      - name: Attach the SBOMs to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release upload "dotnet-v$VERSION" sbom/*.cdx.json --repo "$GITHUB_REPOSITORY" \
            || { echo "::warning::Could not attach the SBOMs to dotnet-v$VERSION; the release itself is published. Add them by hand: gh release upload."; exit 1; }
          echo "SBOMs attached to dotnet-v$VERSION"
