# Pushes the ten staged, author-signed packages to nuget.org with a temporary key from Trusted Publishing (story #3706, ADR 0010).
# The maker runs it by hand for a tag that the release job in Jenkins has staged as a draft release, and approves the environment `nuget`.
# No NuGet key is stored anywhere. The nuget.org policy names this file and the environment `nuget`; the environment is limited to `main`.
# Three jobs: `fetch` reads the draft, `check` runs the scripts of main without any token, and `publish` holds the OIDC token and runs no repository code.
name: NuGet publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag dotnet-vX.Y.Z; a draft release with the staged packages must exist
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reading a draft release needs write access to the repository contents. This job runs no code of the repository and holds no OIDC token.
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Only from main
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::This workflow runs only from refs/heads/main; this run is on '$GITHUB_REF'."
            exit 1
          fi

      - name: Check the tag
        id: check
        env:
          TAG: ${{ inputs.tag }}
        run: |
          pattern='^dotnet-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?)$'
          if ! [[ "$TAG" =~ $pattern ]]; then
            echo "the tag must look like dotnet-vX.Y.Z" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Find the draft release and download its staged files
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.check.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p staged/packages
          releases="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          release_id="$(jq -r --arg tag "$TAG" '[.[] | select(.draft == true and .tag_name == $tag)] | if length == 1 then .[0].id else empty end' <<< "$releases")"
          if ! [[ "$release_id" =~ ^[0-9]+$ ]]; then
            echo "there is not exactly one draft release $TAG" >&2
            exit 1
          fi
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100")"
          while read -r asset_id name; do
            case "$name" in
              SHA256SUMS.signed) target="staged/$name" ;;
              Craticula.*.nupkg) target="staged/packages/$name" ;;
              *) continue ;;
            esac
            [[ "$asset_id" =~ ^[0-9]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "unexpected asset" >&2; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset_id" > "$target"
          done < <(jq -r '.[] | "\(.id) \(.name)"' <<< "$assets")
          test -f staged/SHA256SUMS.signed
          test "$(find staged/packages -name '*.nupkg' | wc -l)" -eq 10

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staged
          path: staged
          retention-days: 1
          if-no-files-found: error

  check:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No OIDC token and no environment: the scripts of main run here, never the ones a release tag points at.
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged
          path: staged

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Check the staged packages
        env:
          VERSION: ${{ needs.fetch.outputs.version }}
        run: |
          python3 scripts/check-staged-packages.py --version "$VERSION" --dir staged/packages --sums staged/SHA256SUMS.signed --certificate scripts/release-certificate.json

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: staged
          path: staged

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # Trusted Publishing: the user is the nuget.org profile name (a repository variable, not a secret).
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          test "$(find staged/packages -maxdepth 1 -name '*.nupkg' | wc -l)" -eq 10
          for f in staged/packages/*.nupkg; do
            dotnet nuget push "$f" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
