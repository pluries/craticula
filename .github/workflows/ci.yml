# Public CI (story #2467, TRD OS-1 / OS-7, spec FR-13): what an outside pull request and every publish to main must pass.
# Two checks, named `build` and `test`, so the branch ruleset on main can require them. It carries what the retired Azure
# PR gate checked and the private Jenkins build does not: the 0-warning build with the NuGet audit, then the offline suite under
# coverage with the 90% line gate (scripts/coverage.sh). Conformance and the SEC-2 lint run in the Jenkins build; the pack smoke
# runs in the release workflow. The `test` job is also what the README coverage badge reads: a gate-status badge ("coverage gate
# 90%"), not a percentage; the per-assembly numbers go to the job summary.
# A `typescript` job (features 012 to 014) installs the TypeScript port from its lock file, builds, tests, runs the SEC-2 lint on its query
# builders and the conformance runner against its driver (rejections and each declared backend); it is a plain job, not a required check.
# A third job, `runtime-11`, is informational and never a required check (ADR-0015, follow-up F-2): it builds a copy of the sources
# on .NET SDK 11 and runs the offline unit tests on the .NET 11 runtime, so a new difference shows when a servicing release lands.
# No secret, read-only token, every action pinned to a commit SHA (scripts/test_workflows.py checks that).
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The newest .NET 10 SDK, as the retired Azure pipeline did; csharp/global.json (10.0.100, rollForward latestFeature) still applies.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # NuGetAudit runs here (csharp/Directory.Build.props): a high or critical advisory (NU1903, NU1904) fails the restore.
      # Locked mode: every package must match the content hash in its packages.lock.json (#4029).
      - name: Restore and audit dependencies
        working-directory: csharp
        run: dotnet restore Craticula.sln --locked-mode

      # The 0-warning bar, and the Security analyzers of csharp/src/.editorconfig as errors.
      - name: Build (0 warnings, security rules)
        working-directory: csharp
        run: dotnet build Craticula.sln -c Release --no-restore -v q -warnaserror "-p:WarningsNotAsErrors=NU1900%3BNU1901%3BNU1902"

  test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Craticula.Conformance.Tests runs the Python conformance runner, and the coverage merge needs Python 3.10+.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The offline suite (no Docker, no live databases) under coverage, then the per-assembly 90% line gate. A failing
      # test or a coverage drop fails this step. The log is kept for the job summary. `shell: bash` is what sets
      # pipefail: without it the pipe to tee would hide coverage.sh's exit code.
      - name: Offline tests and coverage gate
        shell: bash
        run: bash scripts/coverage.sh 2>&1 | tee "$RUNNER_TEMP/coverage.log"

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Offline tests and coverage gate'
            echo
            echo '```'
            tail -n 40 "$RUNNER_TEMP/coverage.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Informational (ADR-0015, follow-up F-2): the packages stay on net10.0, and this job shows how they behave on the .NET 11 runtime.
  # `continue-on-error` keeps its result out of the workflow's: `build` and `test` are the gate. The sources are copied first, so the
  # one edit (the SDK pin in the copy's global.json) never touches a tracked file; the net10.0 test binaries are rolled forward to the
  # newest installed runtime. Conformance.Tests is left out: it starts the driver and the Python suites, which the `test` job already runs.
  runtime-11:
    name: runtime-11 (informational, not a gate)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Copy the sources and pin SDK 11 in the copy
        run: |
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/repo11"
          sed -i 's/"version": "10.0.100"/"version": "11.0.100"/' "$RUNNER_TEMP/repo11/csharp/global.json"

      - name: Restore (locked) and build on SDK 11
        working-directory: ${{ runner.temp }}/repo11/csharp
        run: |
          dotnet --version
          dotnet restore Craticula.sln --locked-mode
          dotnet build Craticula.sln -c Release --no-restore -v q -warnaserror "-p:WarningsNotAsErrors=NU1900%3BNU1901%3BNU1902"

      - name: Offline unit tests on the .NET 11 runtime
        working-directory: ${{ runner.temp }}/repo11/csharp
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
        run: dotnet test Craticula.sln --no-build -c Release -v q --filter "FullyQualifiedName!~MongoDB.Driver.Tests&FullyQualifiedName!~OpenSearch.Client.Tests&FullyQualifiedName!~Integration.Tests.Containers&FullyQualifiedName!~Conformance.Tests"

  # The TypeScript skeleton (feature 012, ADR-0016): the minimum Node (22) and the newest LTS (24). Install from the lock file only,
  # without lifecycle scripts (typescript/.npmrc), then the package tests, then the unchanged runner against the driver. The runner is
  # narrowed to the one family the skeleton covers; that is a debugging aid, not a conformance claim (spec/conformance-runner.md §9).
  typescript:
    name: typescript (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # The conformance runner is Python 3.10+, standard library only.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install from the lock file
        working-directory: typescript
        run: npm ci

      - name: Build and test the package
        working-directory: typescript
        run: npm test

      - name: Conformance runner against the driver (sort-paging, PostgreSQL)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "sort-paging/*#postgres"

      - name: Conformance runner against the driver (the 33 shared rejections)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#rejection"

      - name: Conformance runner against the driver (postgres)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#postgres"

      - name: Conformance runner against the driver (mssql)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#mssql"

      - name: Conformance runner against the driver (mysql)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#mysql"

      - name: Conformance runner against the driver (oracle)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#oracle"

      - name: Conformance runner against the driver (sqlite)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#sqlite"

      - name: Conformance runner against the driver (mongo)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#mongo"

      - name: Conformance runner against the driver (search)
        run: python3 conformance/run.py --driver "node typescript/dist/src/driver.js" --only "*#search"

      # SEC-2 for the TypeScript query builders: only a placeholder, a quoted identifier or a constant may be spliced into query text.
      - name: SEC-2 lint (TypeScript query builders)
        run: python3 scripts/lint-sec2-ts.py
