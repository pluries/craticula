# Docs site (story #1666, task #2836): builds the static site from the repository's own Markdown (scripts/build_site.py) on every
# pull request and every push to main, and fails on a dead, private or unresolved link. Its own workflow, not a job of ci.yml,
# because the branch ruleset requires the ci.yml checks `build` and `test` by name and scripts/test_workflows.py pins them.
# The `site` job builds and checks; the `deploy` job publishes to GitHub Pages only on a push to main and only when the repository variable DOCS_PAGES is "true",
# so a repository whose Pages are not switched on stays green (docs/compliance/pages-craticula.md has the maker's steps).
# No secret, a read-only token except in `deploy`, every action pinned to a commit SHA (scripts/test_workflows.py checks that).
name: docs

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  # A pull request run is replaced by the next push; a run on main is never cancelled, so a Pages deployment is not cut off.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named `site`, not `build`: the branch ruleset requires ci.yml's check `build` by name, and a second check run with that name would
  # make the requirement ambiguous.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # The generator's own tests, then the site itself: exit 1 on a dead link, an unknown anchor or a private path.
      - name: Test the site generator
        run: python3 scripts/test_build_site.py

      - name: Build the site
        run: python3 scripts/build_site.py --out site/_build

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
        with:
          path: site/_build

  deploy:
    needs: site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOCS_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
