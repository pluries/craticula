# CodeQL static analysis of the C# (#4029, OpenSSF Scorecard check SAST). It runs on pushes to main and weekly, by hand when needed,
# and never on a pull request. The C# is analysed from source (build-mode none), so no build and no restore happen here.
# The results go to the repository's code scanning alerts. Both actions are pinned to the commit of release v4.39.3.
name: codeql

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:csharp
