# Release orchestration: Release Please opens and updates a release pull request on `main`, and merging that pull
# request cuts the tag `dotnet-vX.Y.Z` and starts the NuGet release (TRD OS-2) by calling release.yml.
# Trigger: every push to `main`, nothing else. No secret is stored: the default GITHUB_TOKEN opens the pull request
# and creates the tag and the GitHub release. The publish itself stays in release.yml, in the protected environment
# `nuget` (the maker approves each run there); this file adds no approval of its own.
# Known deviations, in plain words: a tag made with the default token starts no other workflow, so the release job
# below calls release.yml directly instead of waiting for a tag trigger; the pull request is merged on the public
# repository and its release commit is synced back to the private repository by the maintainer with a script; the
# repository setting "Allow GitHub Actions to create and approve pull requests" must be on, or the action cannot open
# the release pull request.
# Concurrency: this file uses its own group name. A called workflow that shares the caller's group name is cancelled as
# a deadlock, and release.yml keeps the group `release`, which still serializes the publishes.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # the tag, the GitHub release and the release branch
      pull-requests: write   # open and update the release pull request
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow cannot hold more permissions than its caller: these are exactly what release.yml's jobs declare.
    permissions:
      contents: write        # upload the packages to the release
      id-token: write        # OIDC: NuGet login and the attestation (publish job)
      attestations: write    # actions/attest-build-provenance (publish job)
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.release-please.outputs.version }}
