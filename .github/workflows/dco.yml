# DCO check: every commit of an outside pull request carries a `Signed-off-by` line, instead of a contributor license
# agreement (https://developercertificate.org). One job named `dco`: that is the check name the branch ruleset on main requires.
#
# Why `pull_request_target`: it runs THIS workflow and THIS checker as they are on main, so a pull request cannot rewrite the
# check that judges it (with `pull_request` it would run the pull request's own copy of both). That is only safe because
#   - the job never checks out, builds or runs the pull request's code: the checkout is the base branch (no `ref:`), and the
#     pull request's commits are fetched afterwards as DATA (`git fetch refs/pull/<n>/head`) and only read by `git log`;
#   - the token is read-only (`contents: read`) and no secret is used;
#   - event data comes in through `env:`, never spliced into script text.
# scripts/test_workflows.py checks all of this: an action pinned to a SHA, read-only permissions, no secret, no checkout of the
# pull request's head in a `pull_request_target` workflow, no event expression inside a `run:` block.
# Exempt: the pull requests that Dependabot (`dependabot[bot]`) opens in THIS repository. The exemption reads the pull request author's login and the head repository, which a contributor
# cannot choose; a commit's author e-mail is never an exemption, because anyone can write any e-mail into a commit. Merge
# commits are exempt in the script only when they bring no content of their own.
name: dco

on:
  pull_request_target:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dco-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No `ref:`: the base branch, so the checker is the one on main. The full history holds the base side of the range.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The pull request's commits, as data: fetched into a ref that is never checked out.
      - name: Fetch the pull request commits
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/dco/pr-head"
          fetched="$(git rev-parse refs/dco/pr-head)"
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "The pull request head moved while the check ran ($fetched, expected $HEAD_SHA); the next run checks the new head."
            exit 1
          fi

      - name: Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          exempt=""
          if [ -n "$PR_HEAD_REPO" ] && [ "$PR_HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            case "$PR_AUTHOR" in
              'dependabot[bot]') exempt="pull request opened by Dependabot (dependabot[bot])" ;;
            esac
          fi
          DCO_EXEMPT="$exempt" bash scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
