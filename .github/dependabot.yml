version: 2
updates:
  - package-ecosystem: nuget
    directory: /csharp
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget:
        update-types:
          - minor
          - patch
    # A release must be at least two weeks old before it is proposed, the rule the pinned test packages follow.
    cooldown:
      default-days: 14
    ignore:
      # Security pin (NuGetAudit): System.Security.Cryptography.Pkcs lifts a vulnerable transitive version and stays on
      # the 10.0 line of net10.0. Patch and minor updates are wanted, so security updates still arrive; only a new major is held.
      - dependency-name: System.Security.Cryptography.Pkcs
        update-types: ["version-update:semver-major"]
      # 7.1.1 still pulls in the vulnerable Pkcs version above. Only that release is skipped: a later one is proposed,
      # and the maker checks its Pkcs dependency before taking it.
      - dependency-name: Microsoft.Data.SqlClient
        versions: ["7.1.1"]
      # Held on the 10.0 line, the release line of net10.0 that every project here targets.
      - dependency-name: Microsoft.EntityFrameworkCore.Relational
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.EntityFrameworkCore.Sqlite
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.Data.Sqlite
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        update-types:
          - minor
          - patch
