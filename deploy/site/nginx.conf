# Server of the Craticula documentation site (story #3322, task #3327). A static site: no cookie, no proxy, no log of visitors.
# Everything nginx writes goes to /tmp so that the root filesystem can be read-only.
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  access_log off;
  sendfile on;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080 default_server;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    error_page 404 @notfound;
    location @notfound {
      default_type text/plain;
      return 404 "Not found\n";
    }

    location / {
      try_files $uri $uri/ =404;
    }

    location = /style.css {
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy strict-origin-when-cross-origin always;
      add_header Cache-Control "public, max-age=3600";
    }
  }

  # pluries.dev and www.pluries.dev go to the site with a temporary redirect, path and query kept (FR-08, story #3322).
  # Here and not in an Ingress annotation: the cluster's admission webhook refuses $request_uri in one.
  server {
    listen 8080;
    server_name pluries.dev www.pluries.dev;
    return 302 https://craticula.pluries.dev$request_uri;
  }
}
